<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sugar & Snouts Shop — Browse our homemade baked goods">
  <link rel="shortcut icon" type="image/jpg" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&family=Pacifico&display=swap" rel="stylesheet">
  <title>Shop — Sugar & Snouts</title>
  <style>
    body { background: var(--cream); }
    .shop-hero { background: linear-gradient(135deg, var(--pink) 0%, var(--blue) 100%); padding: 3.5rem 0 2.5rem; text-align: center; }
    .shop-hero h1 { font-family: 'Pacifico', cursive; font-size: clamp(2rem, 5vw, 3rem); color: var(--dark); margin-bottom: .5rem; }
    .shop-hero p  { color: rgba(35,35,35,.7); font-size: 1.05rem; }
  </style>
</head>
<body>

<!-- ── Nav ──────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg sns-nav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="/favicon.jpg" alt="Logo">
      <span>Sugar & Snouts</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="/shop">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        <li class="nav-item ms-lg-2">
          <button class="cart-btn" data-cart-open>
            🛒 Cart
            <span class="cart-badge" id="cartCount" style="display:none">0</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Shop Hero ────────────────────────────────────────────────────────── -->
<div class="shop-hero">
  <div class="container">
    <h1>Our Shop 🛍️</h1>
    <p>Homemade with love — for you and your furry friends</p>
  </div>
</div>

<!-- ── Shop Body ────────────────────────────────────────────────────────── -->
<div class="container py-5">

  <!-- Category filter -->
  <div class="category-filter" id="categoryFilter">
    <button class="category-btn active" data-cat="">All</button>
    <button class="category-btn" data-cat="cookies">🍪 Cookies</button>
    <button class="category-btn" data-cat="cupcakes">🧁 Cupcakes</button>
    <button class="category-btn" data-cat="woof_treats">🐾 Woof Treats</button>
    <button class="category-btn" data-cat="pur_treats">🐱 Pur Treats</button>
    <button class="category-btn" data-cat="other">Other</button>
  </div>

  <!-- Filter tags -->
  <div class="d-flex gap-2 justify-content-center flex-wrap mb-4" id="tagFilter">
    <button class="category-btn" data-tag="featured">⭐ Favourites</button>
    <button class="category-btn" data-tag="new">✨ New</button>
    <button class="category-btn" data-tag="recommended">🍰 Recommended</button>
  </div>

  <!-- Loading -->
  <div class="sns-spinner" id="shopSpinner"></div>

  <!-- Product grid -->
  <div class="row g-4" id="shopGrid" style="display:none"></div>

</div>

<!-- ── Footer ───────────────────────────────────────────────────────────── -->
<div class="bloc bgc-7376 d-bloc">
  <div class="container bloc-lg-lg bloc-md">
    <div class="row">
      <div class="col-12 text-center">
        <div class="row mb-3">
          <div class="col"><a href="/"       class="a-btn footer-link ltc-6728">Home</a></div>
          <div class="col"><a href="/shop"    class="a-btn footer-link ltc-6728">Shop</a></div>
          <div class="col"><a href="/contact" class="a-btn footer-link ltc-6728">Contact</a></div>
        </div>
        <div class="divider-h mx-auto footer-divider"></div>
        <p>Copyright © 2025–<script>document.write(new Date().getFullYear())</script> │ Sugar & Snouts │ All Rights Reserved</p>
        <p id="versionTag" style="font-size:.75rem;opacity:.5"></p>
      </div>
    </div>
  </div>
</div>

<!-- ── Cart Drawer ───────────────────────────────────────────────────────── -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer__header">
    <h3>Your Cart 🛒</h3>
    <button class="cart-close" id="cartClose">✕</button>
  </div>
  <div class="cart-drawer__body" id="cartBody"></div>
  <div class="cart-drawer__footer" id="cartFooter" style="display:none">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">£0.00</strong>
    </div>
    <button class="btn-sns-primary cart-checkout w-100" id="cartCheckout">Place Order</button>
  </div>
</div>

<!-- ── Order Modal ───────────────────────────────────────────────────────── -->
<div class="sns-modal-overlay" id="orderModalOverlay">
  <div class="sns-modal">
    <div class="sns-modal__header">
      <h3>Complete Your Order 🍰</h3>
      <button class="cart-close" id="orderModalClose">✕</button>
    </div>
    <div class="sns-modal__body">
      <div id="orderSummary" style="margin-bottom:1.5rem"></div>
      <form id="orderForm">
        <div class="sns-form-group">
          <label class="sns-label">Your Name *</label>
          <input type="text" name="name" class="sns-input" required placeholder="Jane Smith">
        </div>
        <div class="sns-form-group">
          <label class="sns-label">Email Address *</label>
          <input type="email" name="email" class="sns-input" required placeholder="jane@example.com">
        </div>
        <div class="sns-form-group">
          <label class="sns-label">Phone Number</label>
          <input type="tel" name="phone" class="sns-input" placeholder="07700 900000">
        </div>
        <div class="sns-form-group">
          <label class="sns-label">Notes / Allergies</label>
          <textarea name="notes" class="sns-textarea" placeholder="Any dietary requirements, allergies, or special requests…"></textarea>
        </div>
        <button type="submit" class="btn-sns-primary w-100">Place Order</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
