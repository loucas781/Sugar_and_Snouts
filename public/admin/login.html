<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/jpg" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&family=Pacifico&display=swap" rel="stylesheet">
  <title>Admin Login — Sugar & Snouts</title>
</head>
<body class="admin-body">

<div class="admin-login-page">
  <div class="admin-login-card">
    <img src="/favicon.jpg" alt="Sugar & Snouts" class="admin-login-logo">
    <h1>Sugar & Snouts</h1>
    <p class="subtitle">Admin Dashboard — Please sign in</p>

    <div class="admin-error" id="loginError"></div>

    <form id="loginForm">
      <input type="email" name="email" class="admin-input" placeholder="Email address" required autocomplete="username">
      <input type="password" name="password" class="admin-input" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="admin-login-btn" id="loginBtn">Sign In</button>
    </form>

    <p style="margin-top:1.5rem;font-size:.8rem;color:var(--text-muted)">
      <a href="/" style="color:var(--text-muted)">← Back to website</a>
    </p>

    <p id="versionTag" style="font-size:.72rem;opacity:.45;margin-top:1rem"></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
// Redirect to setup if no admin account exists yet
fetch('/api/auth/setup-status').then(r => r.json()).then(d => {
  if (d.setupRequired) window.location.href = '/admin/setup'
}).catch(() => {})

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const btn   = document.getElementById('loginBtn')
  const error = document.getElementById('loginError')
  btn.disabled = true
  btn.textContent = 'Signing in…'
  error.classList.remove('show')

  const data = new FormData(e.target)
  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: data.get('email'), password: data.get('password') })
    })
    const json = await res.json()
    if (!res.ok) throw new Error(json.error || 'Login failed')
    window.location.href = '/admin/dashboard'
  } catch (err) {
    error.textContent = err.message
    error.classList.add('show')
  } finally {
    btn.disabled = false
    btn.textContent = 'Sign In'
  }
})
</script>
</body>
</html>
