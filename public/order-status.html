<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/jpg" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&family=Pacifico&display=swap" rel="stylesheet">
  <title>Track Your Order — Sugar & Snouts</title>
  <style>
    body { background: var(--cream); }
    .page-hero { background: linear-gradient(135deg, var(--pink) 0%, var(--blue) 100%); padding: 3rem 0 2rem; text-align: center; }
    .page-hero h1 { font-family: 'Pacifico', cursive; font-size: clamp(1.8rem,4vw,2.8rem); color: var(--dark); margin: 0; }

    .order-lookup-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.06); padding: 2rem; max-width: 500px; margin: 0 auto; }

    .status-tracker { margin: 1.5rem 0; }
    .status-steps { display: flex; justify-content: space-between; position: relative; }
    .status-steps::before {
      content: ''; position: absolute; top: 18px; left: 0; right: 0; height: 3px;
      background: #e5e7eb; z-index: 0;
    }
    .status-step { display: flex; flex-direction: column; align-items: center; gap: .4rem; flex: 1; position: relative; z-index: 1; }
    .status-step__dot {
      width: 36px; height: 36px; border-radius: 50%; background: #e5e7eb; color: #9ca3af;
      display: flex; align-items: center; justify-content: center; font-size: .9rem; font-weight: 700;
      border: 3px solid #e5e7eb; transition: all .3s;
    }
    .status-step.done   .status-step__dot { background: var(--gold); border-color: var(--gold); color: var(--dark); }
    .status-step.active .status-step__dot { background: var(--pink); border-color: var(--dark); color: var(--dark); box-shadow: 0 0 0 4px rgba(243,205,209,.4); }
    .status-step.cancelled .status-step__dot { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
    .status-step__label { font-size: .7rem; text-align: center; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; max-width: 70px; }
    .status-step.done   .status-step__label,
    .status-step.active .status-step__label { color: var(--dark); }

    .order-items-table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 1rem 0; }
    .order-items-table th { background: var(--pink); padding: 8px; text-align: left; }
    .order-items-table td { padding: 7px 8px; border-bottom: 1px solid #f0e8e8; }

    .order-meta { background: #f9fafb; border-radius: 10px; padding: 1rem; font-size: .9rem; margin-top: 1rem; }
    .order-meta p { margin: .3rem 0; color: #374151; }
    .order-meta strong { color: var(--dark); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sns-nav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="/favicon.jpg" alt="Logo">
      <span>Sugar & Snouts</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        <li class="nav-item ms-lg-2">
          <button class="cart-btn" data-cart-open>
            🛒 Cart
            <span class="cart-badge" id="cartCount" style="display:none">0</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-hero">
  <div class="container">
    <h1>Track Your Order 📦</h1>
  </div>
</div>

<div class="container py-5">
  <div class="order-lookup-card">
    <p style="color:#6b7280;margin-bottom:1.5rem;text-align:center">Enter your order details to see the latest status.</p>
    <div id="lookupForm">
      <div class="sns-form-group">
        <label class="sns-label">Order ID</label>
        <input type="text" id="orderIdInput" class="sns-input" placeholder="e.g. A1B2C3D4" style="text-transform:uppercase">
      </div>
      <div class="sns-form-group">
        <label class="sns-label">Email Address</label>
        <input type="email" id="orderEmailInput" class="sns-input" placeholder="The email you used to order">
      </div>
      <button id="trackBtn" class="btn-sns-primary w-100">Track Order</button>
      <div id="trackError" style="display:none;margin-top:.75rem;padding:.6rem .9rem;background:#fee2e2;border-radius:8px;color:#991b1b;font-size:.9rem"></div>
    </div>

    <div id="orderResult" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h3 style="margin:0;font-family:'Pacifico',cursive;font-size:1.2rem">Order <span id="resOrderId"></span></h3>
        <button id="trackAgainBtn" style="background:none;border:none;color:var(--dark);font-size:.85rem;cursor:pointer;text-decoration:underline">Track another</button>
      </div>

      <!-- Status tracker -->
      <div class="status-tracker" id="statusTracker"></div>

      <!-- Order meta -->
      <div class="order-meta" id="orderMeta"></div>

      <!-- Items table -->
      <table class="order-items-table" id="orderItemsTable">
        <thead><tr><th>Item</th><th>Qty</th><th style="text-align:right">Total</th></tr></thead>
        <tbody id="orderItemsBody"></tbody>
        <tfoot id="orderItemsFoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<div class="bloc bgc-7376 d-bloc">
  <div class="container bloc-lg-lg bloc-md">
    <div class="row">
      <div class="col-12 text-center">
        <div class="row mb-3">
          <div class="col"><a href="/"            class="a-btn footer-link ltc-6728">Home</a></div>
          <div class="col"><a href="/shop"         class="a-btn footer-link ltc-6728">Shop</a></div>
          <div class="col"><a href="/about"        class="a-btn footer-link ltc-6728">About</a></div>
          <div class="col"><a href="/contact"      class="a-btn footer-link ltc-6728">Contact</a></div>
          <div class="col"><a href="/order-status" class="a-btn footer-link ltc-6728">Track Order</a></div>
          <div class="col"><a href="/terms"        class="a-btn footer-link ltc-6728">Terms</a></div>
          <div class="col"><a href="/privacy"      class="a-btn footer-link ltc-6728">Privacy</a></div>
        </div>
        <div class="divider-h mx-auto footer-divider"></div>
        <p>Copyright &copy; 2025&ndash;<script>document.write(new Date().getFullYear())</script> &nbsp;|&nbsp; Sugar &amp; Snouts &nbsp;|&nbsp; All Rights Reserved</p>
        <p id="versionTag" style="font-size:.75rem;opacity:.5"></p>
      </div>
    </div>
  </div>
</div>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer__header">
    <h3>Your Cart 🛒</h3>
    <button class="cart-close" id="cartClose">✕</button>
  </div>
  <div class="cart-drawer__body" id="cartBody"></div>
  <div class="cart-drawer__footer" id="cartFooter" style="display:none">
    <div class="cart-total"><span>Total</span><strong id="cartTotal">£0.00</strong></div>
    <a href="/shop" class="btn-sns-primary cart-checkout w-100" style="text-align:center">Go to Shop</a>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
'use strict'
const STEPS = [
  { key: 'pending',   label: 'Pending',         icon: '⏳' },
  { key: 'confirmed', label: 'In Preparation',  icon: '👩‍🍳' },
  { key: 'ready',     label: 'Ready',           icon: '🎁' },
  { key: 'collected', label: 'Collected',       icon: '✅' },
]

function renderTracker(status) {
  const tracker = document.getElementById('statusTracker')
  if (status === 'cancelled') {
    tracker.innerHTML = `<div style="text-align:center;padding:1rem;background:#fee2e2;border-radius:10px;color:#991b1b;font-weight:600">❌ This order has been cancelled.</div>`
    return
  }
  const currentIdx = STEPS.findIndex(s => s.key === status)
  tracker.innerHTML = `<div class="status-steps">${STEPS.map((s, i) => {
    const cls = i < currentIdx ? 'done' : i === currentIdx ? 'active' : ''
    return `<div class="status-step ${cls}">
      <div class="status-step__dot">${s.icon}</div>
      <div class="status-step__label">${s.label}</div>
    </div>`
  }).join('')}</div>`
}

async function trackOrder() {
  const id    = document.getElementById('orderIdInput').value.trim()
  const email = document.getElementById('orderEmailInput').value.trim()
  const errEl = document.getElementById('trackError')
  errEl.style.display = 'none'

  if (!id || !email) { errEl.textContent = 'Please enter both your order ID and email.'; errEl.style.display = ''; return }

  const btn = document.getElementById('trackBtn')
  btn.disabled = true; btn.textContent = 'Looking up…'

  try {
    const res  = await fetch(`/api/orders/track?id=${encodeURIComponent(id)}&email=${encodeURIComponent(email)}`)
    const json = await res.json()
    if (!res.ok) throw new Error(json.error)

    document.getElementById('lookupForm').style.display = 'none'
    document.getElementById('orderResult').style.display = ''

    document.getElementById('resOrderId').textContent = json.id.slice(0,8).toUpperCase()
    renderTracker(json.status)

    // Meta info
    const meta = []
    if (json.pickupSlot) meta.push(`<p><strong>Pickup slot:</strong> ${json.pickupSlot}</p>`)
    if (json.orderDate)  meta.push(`<p><strong>Requested date:</strong> ${json.orderDate}</p>`)
    if (json.notes)      meta.push(`<p><strong>Notes:</strong> ${json.notes}</p>`)
    meta.push(`<p><strong>Ordered:</strong> ${new Date(json.createdAt).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })}</p>`)
    document.getElementById('orderMeta').innerHTML = meta.join('')

    // Items
    const tbody = document.getElementById('orderItemsBody')
    tbody.innerHTML = json.items.map(i => `
      <tr>
        <td>${i.productName}</td>
        <td>${i.quantity}</td>
        <td style="text-align:right">£${i.lineTotal.toFixed(2)}</td>
      </tr>`).join('')

    const discountLine = json.discountAmount > 0
      ? `<tr><td colspan="2" style="text-align:right;color:#888;font-size:.85rem">Discount (${json.couponCode}):</td><td style="text-align:right;color:#22c55e">−£${json.discountAmount.toFixed(2)}</td></tr>`
      : ''
    document.getElementById('orderItemsFoot').innerHTML = discountLine
      + `<tr><td colspan="2" style="text-align:right;font-weight:700;padding:8px">Total</td><td style="text-align:right;font-weight:700;padding:8px">£${json.total.toFixed(2)}</td></tr>`

  } catch (err) {
    errEl.textContent = err.message
    errEl.style.display = ''
  } finally {
    btn.disabled = false; btn.textContent = 'Track Order'
  }
}

document.getElementById('trackBtn')?.addEventListener('click', trackOrder)
document.getElementById('orderIdInput')?.addEventListener('keydown', e => { if (e.key === 'Enter') trackOrder() })
document.getElementById('orderEmailInput')?.addEventListener('keydown', e => { if (e.key === 'Enter') trackOrder() })
document.getElementById('trackAgainBtn')?.addEventListener('click', () => {
  document.getElementById('lookupForm').style.display = ''
  document.getElementById('orderResult').style.display = 'none'
})

// Pre-fill from URL params (?id=XXX&email=yyy)
window.addEventListener('DOMContentLoaded', () => {
  const p = new URLSearchParams(location.search)
  if (p.get('id'))    document.getElementById('orderIdInput').value = p.get('id')
  if (p.get('email')) document.getElementById('orderEmailInput').value = p.get('email')
  if (p.get('id') && p.get('email')) trackOrder()
})
</script>
</body>
</html>
