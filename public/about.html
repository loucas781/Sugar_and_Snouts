<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="About Sugar & Snouts — Our story, our passion for baking">
  <link rel="shortcut icon" type="image/jpg" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&family=Pacifico&display=swap" rel="stylesheet">
  <title>About — Sugar & Snouts</title>
  <style>
    body { background: var(--cream); }
    .about-hero { background: linear-gradient(135deg, var(--pink) 0%, var(--blue) 100%); padding: 3.5rem 0 2.5rem; text-align: center; }
    .about-hero h1 { font-family: 'Pacifico', cursive; font-size: clamp(2rem, 5vw, 3rem); color: var(--dark); margin-bottom: .5rem; }
    .about-hero p  { color: rgba(35,35,35,.7); font-size: 1.05rem; }
    .about-card { background: white; border-radius: 20px; box-shadow: var(--shadow-md); padding: 2.5rem; max-width: 780px; margin: 0 auto; }
    .about-content { font-family: 'Old Standard TT', serif; font-size: 1.05rem; line-height: 1.8; color: #333; white-space: pre-wrap; }
    .about-content p { margin-bottom: 1.2rem; }
    .about-placeholder { color: #9ca3af; font-style: italic; text-align: center; padding: 2rem 0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sns-nav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="/favicon.jpg" alt="Logo">
      <span>Sugar & Snouts</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
        <li class="nav-item"><a class="nav-link active" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<div class="about-hero">
  <div class="container">
    <h1 id="aboutTitle">Our Story</h1>
    <p>Baked with love — for you and your furry friends 🍪🐾</p>
  </div>
</div>

<!-- Content -->
<div class="container py-5">
  <div class="about-card">
    <div class="about-content" id="aboutContent">
      <div class="about-placeholder">Our story is coming soon…</div>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="bloc bgc-7376 d-bloc">
  <div class="container bloc-lg-lg bloc-md">
    <div class="row">
      <div class="col-12 text-center">
        <div class="row mb-3">
          <div class="col"><a href="/"            class="a-btn footer-link ltc-6728">Home</a></div>
          <div class="col"><a href="/shop"         class="a-btn footer-link ltc-6728">Shop</a></div>
          <div class="col"><a href="/about"        class="a-btn footer-link ltc-6728">About</a></div>
          <div class="col"><a href="/contact"      class="a-btn footer-link ltc-6728">Contact</a></div>
          <div class="col"><a href="/order-status" class="a-btn footer-link ltc-6728">Track Order</a></div>
          <div class="col"><a href="/terms"        class="a-btn footer-link ltc-6728">Terms</a></div>
          <div class="col"><a href="/privacy"      class="a-btn footer-link ltc-6728">Privacy</a></div>
        </div>
        <div class="divider-h mx-auto footer-divider"></div>
        <p>Copyright &copy; 2025&ndash;<script>document.write(new Date().getFullYear())</script> &nbsp;|&nbsp; Sugar &amp; Snouts &nbsp;|&nbsp; All Rights Reserved</p>
        <p id="versionTag" style="font-size:.75rem;opacity:.5"></p>
      </div>
    </div>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const s = await fetch('/api/settings').then(r => r.json())
    const titleEl   = document.getElementById('aboutTitle')
    const contentEl = document.getElementById('aboutContent')
    if (titleEl && s.about_title)   titleEl.textContent = s.about_title
    if (contentEl && s.about_content) {
      contentEl.innerHTML = s.about_content
        .split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')
    }
  } catch { /* no-op */ }
})
</script>
</body>
</html>
