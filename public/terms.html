<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/jpg" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&family=Pacifico&display=swap" rel="stylesheet">
  <title>Terms &amp; Conditions — Sugar &amp; Snouts</title>
  <style>
    body { background: var(--cream); }
    .page-hero { background: linear-gradient(135deg, var(--pink) 0%, var(--blue) 100%); padding: 3rem 0 2rem; text-align: center; }
    .page-hero h1 { font-family: 'Pacifico', cursive; font-size: clamp(1.8rem,4vw,2.8rem); color: var(--dark); margin: 0; }
    .prose { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.06); padding: 2.5rem; max-width: 760px; margin: 0 auto; line-height: 1.8; }
    .prose h2 { font-family: 'Pacifico', cursive; font-size: 1.3rem; color: var(--dark); margin-top: 1.8rem; }
    .prose p  { color: #374151; }
    .prose-empty { text-align:center; color:#9ca3af; padding:3rem 0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sns-nav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="/favicon.jpg" alt="Logo">
      <span>Sugar & Snouts</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        <li class="nav-item ms-lg-2">
          <button class="cart-btn" data-cart-open>
            🛒 Cart
            <span class="cart-badge" id="cartCount" style="display:none">0</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-hero">
  <div class="container">
    <h1>Terms &amp; Conditions</h1>
  </div>
</div>

<div class="container py-5">
  <div class="prose" id="termsContent">
    <div class="sns-spinner"></div>
  </div>
</div>

<div class="bloc bgc-7376 d-bloc">
  <div class="container bloc-lg-lg bloc-md">
    <div class="row">
      <div class="col-12 text-center">
        <div class="row mb-3">
          <div class="col"><a href="/"            class="a-btn footer-link ltc-6728">Home</a></div>
          <div class="col"><a href="/shop"         class="a-btn footer-link ltc-6728">Shop</a></div>
          <div class="col"><a href="/contact"      class="a-btn footer-link ltc-6728">Contact</a></div>
          <div class="col"><a href="/order-status" class="a-btn footer-link ltc-6728">Track Order</a></div>
          <div class="col"><a href="/terms"        class="a-btn footer-link ltc-6728">Terms</a></div>
          <div class="col"><a href="/privacy"      class="a-btn footer-link ltc-6728">Privacy</a></div>
        </div>
        <div class="divider-h mx-auto footer-divider"></div>
        <p>Copyright &copy; 2025&ndash;<script>document.write(new Date().getFullYear())</script> &nbsp;|&nbsp; Sugar &amp; Snouts &nbsp;|&nbsp; All Rights Reserved</p>
        <p id="versionTag" style="font-size:.75rem;opacity:.5"></p>
      </div>
    </div>
  </div>
</div>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer__header"><h3>Your Cart 🛒</h3><button class="cart-close" id="cartClose">✕</button></div>
  <div class="cart-drawer__body" id="cartBody"></div>
  <div class="cart-drawer__footer" id="cartFooter" style="display:none">
    <div class="cart-total"><span>Total</span><strong id="cartTotal">£0.00</strong></div>
    <a href="/shop" class="btn-sns-primary cart-checkout w-100" style="text-align:center">Go to Shop</a>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
fetch('/api/settings').then(r => r.json()).then(s => {
  const el = document.getElementById('termsContent')
  if (s.terms_content) {
    el.innerHTML = s.terms_content
  } else {
    el.innerHTML = `<div class="prose-empty"><p>Terms &amp; Conditions content has not been set yet.</p><p>Please check back soon.</p></div>`
  }
}).catch(() => {
  document.getElementById('termsContent').innerHTML = `<div class="prose-empty"><p>Could not load content. Please try again later.</p></div>`
})
</script>
</body>
</html>
